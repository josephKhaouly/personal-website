<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joseph Khaouly — Contact</title>
<meta name="description" content="Joseph Khaouly — Founder, Joseph Khaouly AI Lab. Contact details and links.">
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --ink:#14182B;
    --ink-soft:#454B5E;
    --paper:#EEF0EE;
    --panel:#FFFFFF;
    --line:#DCE0DC;
    --accent:#2F6F5E;
    --accent-dim:#E4EEEA;
    --serif: ui-serif, Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "Roboto Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:var(--sans); background:var(--paper); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:32px 16px;
  }
  .card{
    width:100%; max-width:400px; background:var(--panel); border:1px solid var(--line);
    border-radius:16px; padding:32px 28px 28px; text-align:center;
  }
  .avatar{
    width:112px; height:112px; border-radius:50%; object-fit:cover; margin:0 auto 16px;
    display:block; border:3px solid var(--panel); box-shadow:0 0 0 1px var(--line);
  }
  h1{font-family:var(--serif); font-size:24px; font-weight:600; margin:0 0 4px;}
  .title{font-size:14px; color:var(--ink-soft); margin:0 0 2px;}
  .loc{font-size:12.5px; color:var(--ink-soft); margin:0 0 14px;}
  .badge{
    display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600;
    background:var(--accent-dim); color:var(--accent); border-radius:20px; padding:6px 12px;
    margin-bottom:20px;
  }
  .contact-list{border-top:1px solid var(--line); border-bottom:1px solid var(--line); margin:4px 0 18px;}
  .contact-row{
    display:flex; align-items:center; gap:10px; padding:12px 4px; text-decoration:none;
    color:var(--ink); font-size:14px; border-bottom:1px solid var(--line);
  }
  .contact-row:last-child{border-bottom:none;}
  .contact-row svg{flex-shrink:0; color:var(--accent);}
  .save-btn{
    display:flex; align-items:center; justify-content:center; gap:8px; width:100%;
    background:var(--ink); color:#fff; font-family:var(--sans); font-weight:600; font-size:14px;
    border:none; border-radius:10px; padding:13px; cursor:pointer; margin-bottom:16px;
  }
  .save-btn:hover{background:var(--accent);}
  .links-row{display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:24px;}
  .pill{
    display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink);
    border:1px solid var(--line); border-radius:20px; padding:8px 14px; text-decoration:none;
  }
  .pill:hover{border-color:var(--accent); color:var(--accent);}
  .pill svg{color:var(--accent);}
  .qr-section{border-top:1px solid var(--line); padding-top:20px;}
  .qr-section p{font-size:11.5px; color:var(--ink-soft); margin:0 0 10px;}
  #qrcode{display:flex; justify-content:center; margin-bottom:8px;}
  #qrcode img, #qrcode canvas{border-radius:8px;}
  .url-text{font-family:var(--mono); font-size:11px; color:var(--slate,#6B7169);}
</style>
</head>
